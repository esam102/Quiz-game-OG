<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime & Gaming Quiz — Kies je Avontuur</title>
    <link rel="icon" type="image/png" href="hat.png">
    <link rel="stylesheet" href="main.css">
</head>
<body>

     <nav class="site-nav">
        <a href="index.html" class="brand">
            <span class="brand-icon">☠️</span>
            <span class="brand-title">Anime & Gaming Quiz</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="quiz.html">Categorieën</a></li>
        </ul>
    </nav>

    <svg class="compass-deco" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#2b2118" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="38" fill="none" stroke="#2b2118" stroke-width="1"/>
        <g stroke="#2b2118" stroke-width="1">
            <line x1="50" y1="4" x2="50" y2="96"/>
            <line x1="4" y1="50" x2="96" y2="50"/>
        </g>
        <polygon points="50,14 56,50 50,86 44,50" fill="#9b3a2e"/>
        <polygon points="14,50 50,44 86,50 50,56" fill="#2b2118"/>
    </svg>


    <div class="welcome-container">
        <div class="logo-circle">
            <img src="pirate.jpg" alt="Strohoed">
        </div>

        <h1 class="welcome-title">Anime & Gaming Quiz</h1>
        <p class="welcome-text">
            Test je kennis in epische categorieën. Bewijs dat jij de ultieme expert bent in de wereld van anime, series en games!
        </p>

        <div class="badges-container">
            <span class="badge">⚔️ Anime</span>
            <span class="badge">🎮 Gaming</span>
            <span class="badge">👒 One Piece</span>
        </div>

        <a href="quiz.html" class="start-btn">
            Start het Avontuur
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="music-btn" class="music-toggle" onclick="toggleMusic()">
        🔇 Muziek Uit
    </button>

    <script>
        const music = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-btn");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerHTML = "🔇 Muziek Uit";
            } else {
                music.play();
                musicBtn.innerHTML = "🔊 Muziek Aan";
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
